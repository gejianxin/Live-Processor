[package]
name = "live-processor"
version = "2.4.4-rev1"
edition = "2024"
authors = ["gejianxin", "O Deus Audio (Original)", "Give Academy (Patch)", "DirkoAudio (Repack)"]
description = "Modern Rust reimagining of ASIO Link Pro installer, manager and runtime supervisor"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gejianxin/Live-Processor"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
anyhow = "1.0"
winreg = "0.52"
flate2 = "1.0"
tar = "0.4"
colored = "2.2"
indicatif = "0.17"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_SystemServices",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_System_Com",
] }

[build-dependencies]
flate2 = "1.0"
tar = "0.4"
anyhow = "1.0"
