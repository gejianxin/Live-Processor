name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release-build:
    name: Build Release (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: live-processor-windows-x64.exe
            bin: target/x86_64-pc-windows-msvc/release/live-processor.exe
            use_cross: false

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: live-processor-linux-x64
            bin: target/x86_64-unknown-linux-gnu/release/live-processor
            use_cross: false

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset_name: live-processor-linux-arm64
            bin: target/aarch64-unknown-linux-gnu/release/live-processor
            use_cross: true

    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install cross tool
      if: matrix.use_cross
      run: cargo install cross --git https://github.com/cross-rs/cross

    - name: Build with Cargo
      if: "!matrix.use_cross"
      run: cargo build --release --target ${{ matrix.target }}

    - name: Build with Cross
      if: matrix.use_cross
      run: cross build --release --target ${{ matrix.target }}

    - name: Rename binary for release
      shell: bash
      run: cp "${{ matrix.bin }}" "${{ matrix.asset_name }}"

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ matrix.asset_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
