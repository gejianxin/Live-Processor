name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: live-processor-windows-x64
            bin_gui: target/x86_64-pc-windows-msvc/release/live-processor-gui.exe
            bin_cli: target/x86_64-pc-windows-msvc/release/live-processor-cli.exe
            use_cross: false

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: live-processor-linux-x64
            bin_gui: target/x86_64-unknown-linux-gnu/release/live-processor-gui
            bin_cli: target/x86_64-unknown-linux-gnu/release/live-processor-cli
            use_cross: false

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: live-processor-linux-arm64
            bin_gui: target/aarch64-unknown-linux-gnu/release/live-processor-gui
            bin_cli: target/aarch64-unknown-linux-gnu/release/live-processor-cli
            use_cross: true

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install Linux build dependencies
      if: runner.os == 'Linux' && !matrix.use_cross
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev

    - name: Install cross tool
      if: matrix.use_cross
      run: cargo install cross --git https://github.com/cross-rs/cross

    - name: Build with Cargo
      if: "!matrix.use_cross"
      run: cargo build --release --target ${{ matrix.target }} --bins

    - name: Build with Cross
      if: matrix.use_cross
      run: cross build --release --target ${{ matrix.target }} --bins

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: |
          ${{ matrix.bin_gui }}
          ${{ matrix.bin_cli }}
